<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>精読トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="app">
<div class="tape">
<div class="cell"><span class="lab">正答率</span><span class="val" id="acc">—</span></div>
<div class="cell"><span class="lab">連続</span><span class="val" id="streak">0</span></div>
<div class="cell"><span class="lab">スコア</span><span class="val hot" id="score">0</span></div>
<div class="cell"><span class="lab">ベスト</span><span class="val" id="best" style="color:var(--cyan)">0</span></div>
</div>

<div class="head"><div class="brand"><span class="orb"></span>精読トレーナー<small>DEEP READ ENGINE</small></div></div>

<div class="controls">
<div class="seg" id="modeSeg">
<button data-mode="read" class="on">精読</button>
<button data-mode="vocab">単語</button>
</div>
<div class="chips" id="sessChips"></div>
<div class="chips" id="lvlChips"></div>
<div class="lvlbadgebar" id="lvlSummary"></div>
<div id="storageWarn" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:7px 10px;line-height:1.5;"></div>
</div>

<div class="stage" id="stage"></div>
<div class="actions" id="actions"></div>
</div>
<script src="questions.js"></script>
<script src="storage.js"></script>
<script src="script.js"></script>
</body>
</html>
